name: Озон монитор цен

on:
  schedule:
    - cron: '0 * * * *'  # каждый час
  workflow_dispatch:       # кнопка ручного запуска

permissions:
  contents: write          # нужно чтобы сохранять prices.json обратно в репо

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить requests
        run: pip install requests

      - name: Запустить мониторинг
        env:
          TG_TOKEN:   ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py

      - name: Сохранить обновлённые данные в репозиторий
        run: |
          git config user.name  "Ozon Monitor Bot"
          git config user.email "bot@ozon-monitor"
          git add products.json
          git diff --staged --quiet || git commit -m "update prices $(date -u +%Y-%m-%d\ %H:%M)"
          git push
